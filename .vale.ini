StylesPath = styles

# `just setup` syncs these into styles/. Both ai-tells URLs carry the release tag, so a
# version change edits both, and `just setup` must run again to fetch it.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip, Google, write-good, alex

[*.md]
BasedOnStyles = ai-tells, Google, write-good, alex, Unslop
write-good.E-Prime = NO
# Flags bold run-in labels such as "**Note:** Text", which these docs use.
ai-tells.ColonUsage = NO

# Git writes the message to .git/COMMIT_EDITMSG, or under .git/worktrees/ in a linked
# worktree, and the hook may pass it as a relative or an absolute path. The ** pattern
# matches every form.
[{COMMIT_EDITMSG,**/COMMIT_EDITMSG}]
BasedOnStyles = ai-tells, ai-tells-commits

[formats]
COMMIT_EDITMSG = md
