name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    container:
      # Playwright 1.64.1 on Ubuntu 24.04. The browsers and their system libraries are
      # already in the image.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `just prose` lists files with git, which refuses a checkout that another user owns.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          install_args: node npm:corepack bun just vale

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Vale packages
        run: just setup

      - name: Run the gate
        run: just ci
