packages:
  - "."

catalogMode: strict
cleanupUnusedCatalogs: true
blockExoticSubdeps: true

# Seven-day cooldown for every publish.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

trustPolicy: no-downgrade
verifyDepsBeforeRun: warn
# A pnpm other than the packageManager pin stops instead of running.
pmOnFail: error

strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds: {}

peerDependencyRules:
  allowedVersions:
    # vite-plus installs its own core package as vite. Its version, 1.4.0, is outside
    # the range Vitest declares, though it's the Vite that Vitest runs on.
    "vitest>vite": "*"
    "@vitest/mocker>vite": "*"

catalog:
  "@effect/platform-bun": 4.1.4
  "@effect/platform-node": 4.1.4
  "@mplibunao/oxlint-standards": 0.2.0
  "@mplibunao/tsconfig": 0.2.0
  "@playwright/test": 1.64.1
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  bun-types: 1.4.4
  effect: 4.1.4
  # The version vite-plus 1.4.0 runs, so the Oxlint pack's peer resolves to the same copy.
  oxlint: 1.89.0
  typescript: 7.0.2
  vite-plus: 1.4.0
